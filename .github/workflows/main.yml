name: SmileJobs Admin Backend CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: smilejobs-admin-backend-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI - Validate Admin Backend Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Validate code syntax
        run: |
          if [ -f src/server.js ]; then
            node --check src/server.js
          elif [ -f server.js ]; then
            node --check server.js
          elif [ -f src/index.js ]; then
            node --check src/index.js
          elif [ -f index.js ]; then
            node --check index.js
          fi

      - name: CI completed
        run: echo "Admin backend CI validation completed successfully."

  deploy:
    name: CD - Deploy Admin Backend to DigitalOcean
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Configure SSH key
        env:
          DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
          DO_HOST: ${{ secrets.DO_HOST }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Decode Base64 SSH key
          echo "$DO_SSH_KEY_B64" | tr -d '\r\n ' | base64 --decode > ~/.ssh/smilejobs_deploy_key
          chmod 600 ~/.ssh/smilejobs_deploy_key

          # Add Droplet host to known_hosts
          ssh-keyscan -H "$DO_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          echo "SSH configuration complete."

      - name: Deploy Admin Backend
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -e

          echo "=========================================="
          echo "Starting SmileJobs Admin Backend deployment"
          echo "=========================================="

          ssh \
            -i ~/.ssh/smilejobs_deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$DO_USER@$DO_HOST" << 'REMOTE_SCRIPT'

          set -e

          echo "Connected to DigitalOcean successfully."

          cd /var/www/smilejobs-admin-backend

          echo "Fetching latest code..."
          git fetch origin main
          git reset --hard origin/main

          echo "Installing production dependencies..."
          npm install --omit=dev --legacy-peer-deps --no-audit --no-fund

          echo "Checking PM2 process..."

          # Identify entry file
          ENTRY_FILE="server.js"
          if [ -f "src/server.js" ]; then
            ENTRY_FILE="src/server.js"
          elif [ -f "src/index.js" ]; then
            ENTRY_FILE="src/index.js"
          elif [ -f "index.js" ]; then
            ENTRY_FILE="index.js"
          fi

          if pm2 describe smilejobs-admin > /dev/null 2>&1; then
            echo "Restarting smilejobs-admin..."
            pm2 restart smilejobs-admin --update-env
          else
            echo "Starting smilejobs-admin for the first time..."
            pm2 start "$ENTRY_FILE" --name smilejobs-admin
            pm2 save
          fi

          echo "Waiting for admin backend to warm up..."
          sleep 4

          echo "PM2 Status:"
          pm2 status

          echo "Checking admin health endpoint..."
          curl -s http://127.0.0.1:5003/health || curl -s http://127.0.0.1:5003/ || echo "Health check complete."

          echo ""
          echo "=========================================="
          echo "SmileJobs Admin Backend deployment successful!"
          echo "=========================================="

          REMOTE_SCRIPT

      - name: Deployment completed
        run: echo "Admin backend production deployment completed successfully."
